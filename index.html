    <style>
/* O Estúdio Musical da Helena Sophia — estilos
 * Pensado primeiro para celular (retrato e paisagem); telas maiores ganham mais espaço.
 * O tabuleiro de instrumentos se adapta ao espaço disponível (container queries). */

:root {
  --radius: 1.5rem;
  --background: oklch(0.93 0.05 310);
  --foreground: oklch(0.3 0.12 310);
  --card: oklch(0.98 0.02 320);
  --primary: oklch(0.62 0.2 340);
  --primary-foreground: oklch(0.99 0.01 340);
  --secondary: oklch(0.6 0.17 300);
  --muted-foreground: oklch(0.5 0.08 310);
  --accent: oklch(0.86 0.15 90);
  --accent-foreground: oklch(0.35 0.1 60);
  --destructive: oklch(0.6 0.22 25);
  --border: oklch(0.82 0.08 310);
  --pink: oklch(0.72 0.18 350);
  --gold: oklch(0.86 0.15 85);
  --mint: oklch(0.8 0.13 165);
  --sky: oklch(0.75 0.12 235);
  --peach: oklch(0.8 0.12 50);
  --gradient-studio:
    radial-gradient(circle at 20% 10%, oklch(0.9 0.08 340), transparent 50%),
    radial-gradient(circle at 80% 90%, oklch(0.85 0.1 290), transparent 55%), oklch(0.93 0.05 310);
  --shadow-toy: 0 4px 0 oklch(0.45 0.15 310 / 0.35);
  --shadow-toy-pressed: 0 1px 0 oklch(0.45 0.15 310 / 0.35);
  --shadow-glow: 0 0 24px oklch(0.8 0.18 340 / 0.7);
  --font-display: "Fredoka", system-ui, sans-serif;
  --font-script: "Pacifico", cursive;
}

*,
*::before,
*::after {
  box-sizing: border-box;
  border-color: var(--border);
}

[hidden] {
  display: none !important;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--gradient-studio);
  background-attachment: fixed;
  color: var(--foreground);
  font-family: var(--font-display);
  line-height: 1.5;
  /* Tocar não deve selecionar texto, abrir menu de pressionar-e-segurar nem "puxar para atualizar" */
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible {
  outline: 4px solid var(--primary);
  outline-offset: 3px;
}

/* ---------- cores ---------- */
.c-sky { background: var(--sky); }
.c-peach { background: var(--peach); }
.c-pink { background: var(--pink); }
.c-mint { background: var(--mint); }
.c-gold { background: var(--gold); }
.c-secondary { background: var(--secondary); }
.c-destructive { background: var(--destructive); }

/* ---------- botão de brinquedo ---------- */
.toy {
  box-shadow: var(--shadow-toy);
  transition: transform 80ms ease, box-shadow 80ms ease;
}
.toy:active {
  transform: translateY(4px);
  box-shadow: var(--shadow-toy-pressed);
}

/* ---------- tela inicial ---------- */
.intro {
  display: flex;
  min-height: 100vh;
  min-height: 100dvh;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.25rem;
  padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
    max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
}
.intro-img {
  display: block;
  aspect-ratio: 617 / 342;
  height: auto;
  /* cabe na largura e nunca passa de ~60% da altura da tela (celular deitado) */
  width: min(100%, 48rem, calc(60vh * 617 / 342));
  width: min(100%, 48rem, calc(60dvh * 617 / 342));
  border: 6px solid var(--card);
  border-radius: 1.5rem;
  box-shadow: var(--shadow-toy);
}
.start-btn {
  padding: clamp(0.75rem, 3vw, 1.25rem) clamp(1.5rem, 7vw, 3rem);
  border-radius: 9999px;
  background: var(--primary);
  color: var(--primary-foreground);
  font-size: clamp(1.5rem, 6vw, 2.25rem);
  line-height: 1.2;
  font-weight: 700;
  animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}

.install-btn {
  padding: 0.4rem 1.2rem;
  border-radius: 9999px;
  background: var(--card);
  color: var(--foreground);
  font-size: 1.05rem;
  line-height: 1.3;
  font-weight: 700;
}
.install-hint {
  max-width: 28rem;
  margin: 0;
  text-align: center;
  font-size: 0.95rem;
  color: var(--muted-foreground);
}
@media (max-height: 520px) {
  .intro { gap: 0.5rem; }
  .install-btn { padding: 0.2rem 1rem; font-size: 0.9rem; }
  .install-hint { font-size: 0.8rem; }
}

/* ---------- controle dos pais e gravação ---------- */
.panel-music { position: relative; }
.gear {
  position: absolute;
  right: 0.5rem;
  top: 0.4rem;
  width: 2.4rem;
  height: 2.4rem;
  border-radius: 9999px;
  background: transparent;
  font-size: 1.2rem;
  line-height: 1;
  opacity: 0.35;
  touch-action: none;
  -webkit-touch-callout: none;
}
.gear.holding { opacity: 1; animation: gear-spin 3s linear forwards; }
@keyframes gear-spin { to { transform: rotate(360deg); } }
.modal {
  position: fixed;
  inset: 0;
  z-index: 70;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  background: oklch(0.3 0.12 310 / 0.55);
}
.sheet {
  display: flex;
  width: min(100%, 28rem);
  max-height: 92dvh;
  flex-direction: column;
  gap: 0.6rem;
  overflow-y: auto;
  padding: 1rem 1.25rem;
  border: 5px solid var(--card);
  border-radius: 1.75rem;
  background: var(--gradient-studio);
  box-shadow: var(--shadow-toy), var(--shadow-glow);
  -webkit-user-select: text;
  user-select: text;
}
.sheet-title { margin: 0; text-align: center; font-size: 1.3rem; line-height: 1.3; font-weight: 700; }
.sheet-info { margin: 0; text-align: center; font-size: 0.95rem; color: var(--muted-foreground); }
.sheet .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.4rem 0.75rem; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; }
.chip {
  padding: 0.35rem 0.9rem;
  border-radius: 9999px;
  background: var(--card);
  color: var(--foreground);
  font-size: 1rem;
  line-height: 1.3;
  font-weight: 700;
}
.chip[aria-pressed="true"], .chip.on { background: var(--secondary); color: var(--primary-foreground); }
.chip.primary { background: var(--primary); color: var(--primary-foreground); }
.sheet input[type="text"] {
  padding: 0.5rem 0.9rem;
  border: 3px solid var(--border);
  border-radius: 1rem;
  background: var(--card);
  color: var(--foreground);
  font: inherit;
  font-size: 1.1rem;
  text-align: center;
}
.sheet input[type="range"] { flex: 1 1 8rem; accent-color: var(--primary); }
.mine { display: flex; flex-direction: column; gap: 0.35rem; }
.mine .mine-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.25rem 0.5rem 0.25rem 0.75rem; border-radius: 1rem; background: color-mix(in oklch, var(--card) 80%, transparent); font-weight: 700; }
.mine .chip { padding: 0.15rem 0.6rem; }
.emoji-opt { width: 2.8rem; height: 2.8rem; padding: 0; border-radius: 9999px; background: var(--card); font-size: 1.5rem; line-height: 1; }
.emoji-opt[aria-pressed="true"] { background: var(--accent); box-shadow: 0 0 0 3px var(--primary); }
.rec-bar {
  position: fixed;
  top: max(0.5rem, env(safe-area-inset-top));
  left: 50%;
  z-index: 65;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.4rem 0.8rem;
  border: 3px solid var(--card);
  border-radius: 9999px;
  background: var(--destructive);
  color: var(--primary-foreground);
  font-weight: 700;
  transform: translateX(-50%);
  white-space: nowrap;
}
.rec-bar .toy { padding: 0.1rem 0.6rem; border-radius: 9999px; background: var(--card); font-size: 1.2rem; line-height: 1.4; }
.song-list { max-height: 13rem; overflow-y: auto; }
@media (max-height: 520px) {
  .song-list { max-height: none; grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 5.2rem; overflow-x: auto; overflow-y: hidden; }
  .gear { top: 50%; margin-top: -1.2rem; }
}
@media (min-width: 640px) and (min-height: 521px) {
  .song-list { max-height: none; }
}

/* ---------- estúdio ---------- */
.app {
  position: relative;
  display: flex;
  min-height: 100vh;
  min-height: 100dvh;
  max-width: 64rem;
  flex-direction: column;
  gap: clamp(0.5rem, 2vw, 1.25rem);
  margin: 0 auto;
  overflow: hidden;
  padding: max(0.75rem, env(safe-area-inset-top)) max(0.75rem, env(safe-area-inset-right))
    max(0.75rem, env(safe-area-inset-bottom)) max(0.75rem, env(safe-area-inset-left));
}
header { text-align: center; }
h1 {
  margin: 0;
  color: var(--primary);
  font-family: var(--font-script);
  font-size: clamp(1.4rem, 6vw, 3rem);
  line-height: 1.2;
  font-weight: 400;
  filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.15));
}

/* Instrumentos: uma fileira com os 7 ícones (celular) */
.instruments {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 0.4rem;
}
.inst {
  display: flex;
  min-width: 0;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0.4rem 0.1rem;
  border-radius: 1.25rem;
  color: var(--foreground);
  font-weight: 600;
  opacity: 0.85;
}
.inst[aria-pressed="true"] {
  opacity: 1;
  transform: scale(1.08);
  box-shadow: 0 0 0 3px var(--card), var(--shadow-glow);
}
.inst[aria-pressed="true"]:active { transform: scale(1.08) translateY(4px); }
.inst .emoji { font-size: 1.7rem; line-height: 1.3; }
.inst .label { display: none; font-size: 0.7rem; line-height: 1.1; }

.panel {
  padding: 0.75rem;
  border: 3px solid var(--card);
  border-radius: 1.5rem;
  background: color-mix(in oklch, var(--card) 70%, transparent);
  box-shadow: var(--shadow-toy);
}
.panel-board {
  display: flex;
  flex: 1 1 0;
  flex-direction: column;
  min-height: 0;
}
.panel-title { margin: 0 0 0.4rem; font-size: 0.95rem; line-height: 1.3; font-weight: 700; }
.panel-music { text-align: center; }
.current { margin: 0 0 0.4rem; text-align: center; font-size: 1.1rem; line-height: 1.4; font-weight: 700; }
.hint { margin: 0.4rem 0 0; text-align: center; font-size: 0.8rem; color: var(--muted-foreground); }
.hint:empty { display: none; }
@media (hover: none) and (pointer: coarse) {
  .hint-kbd { display: none; } /* dica do teclado não faz sentido no toque */
}

/* ---------- tabuleiro (área onde se toca) ---------- */
#board {
  container-type: size; /* os instrumentos medem o espaço que sobrou */
  display: flex;
  flex: 1 1 0;
  align-items: center;
  justify-content: center;
  min-height: 9rem;
  touch-action: none; /* tocar com vários dedos não dá zoom nem rola a página */
  user-select: none;
  -webkit-user-select: none;
}

/* Bateria: pads redondos, tamanho calculado para caber */
.drums {
  --g: 0.75rem;
  --s: min((100cqw - 2 * var(--g)) / 3, (100cqh - var(--g)) / 2, 13rem);
  display: grid;
  grid-template-columns: repeat(3, var(--s));
  grid-template-rows: repeat(2, var(--s));
  gap: var(--g);
  justify-content: center;
  align-content: center;
}
@container (min-aspect-ratio: 3/1) {
  .drums {
    --s: min((100cqw - 5 * var(--g)) / 6, 100cqh, 13rem);
    grid-template-columns: repeat(6, var(--s));
    grid-template-rows: var(--s);
  }
}
@container (max-aspect-ratio: 3/4) {
  .drums {
    --s: min((100cqw - var(--g)) / 2, (100cqh - 2 * var(--g)) / 3, 13rem);
    grid-template-columns: repeat(2, var(--s));
    grid-template-rows: repeat(3, var(--s));
  }
}
.pad {
  display: flex;
  width: 100%;
  height: 100%;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 9999px;
  color: var(--foreground);
  font-weight: 700;
}
.pad .emoji { font-size: calc(var(--s) * 0.38); line-height: 1.1; }
.pad .name { font-size: clamp(0.75rem, calc(var(--s) * 0.14), 1.25rem); line-height: 1.2; }

/* Piano */
.piano {
  position: relative;
  display: flex;
  width: 100%;
  height: min(100cqh, 28rem);
}
.key {
  display: flex;
  flex: 1 1 0;
  min-width: 0;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  margin: 0 1px; /* margens simétricas: as teclas pretas ficam certinho entre as brancas */
  padding-bottom: 0.5rem;
  border: 2px solid var(--border);
  border-radius: 0 0 clamp(0.6rem, 3cqw, 1.75rem) clamp(0.6rem, 3cqw, 1.75rem);
  background: var(--card);
  color: var(--foreground);
  font-size: clamp(0.8rem, 3.6cqw, 1.25rem);
  font-weight: 700;
}
.key .dot {
  width: clamp(1rem, 4.5cqw, 1.5rem);
  height: clamp(1rem, 4.5cqw, 1.5rem);
  margin-bottom: 0.4rem;
  border-radius: 9999px;
}
.key.lit { background: var(--accent); }
.black {
  position: absolute;
  top: 0;
  left: calc((var(--after) + 1) / 8 * 100% - 4%);
  width: 8%;
  height: 58%;
  z-index: 1;
  border-radius: 0 0 clamp(0.5rem, 2.5cqw, 1.5rem) clamp(0.5rem, 2.5cqw, 1.5rem);
  background: var(--foreground);
}
.black.lit { background: var(--primary); }

/* Flautas: 8 círculos */
.notes:not(.strings) {
  --g: 0.6rem;
  --s: min((100cqw - 3 * var(--g)) / 4, (100cqh - var(--g)) / 2, 12rem);
  display: grid;
  grid-template-columns: repeat(4, var(--s));
  grid-template-rows: repeat(2, var(--s));
  gap: var(--g);
  justify-content: center;
  align-content: center;
}
@container (min-aspect-ratio: 4/1) {
  .notes:not(.strings) {
    --s: min((100cqw - 7 * var(--g)) / 8, 100cqh, 12rem);
    grid-template-columns: repeat(8, var(--s));
    grid-template-rows: var(--s);
  }
}
.notes:not(.strings) .note { width: 100%; height: 100%; font-size: calc(var(--s) * 0.3); }

/* Cordas (violão, guitarra, violino): 8 cordas, ou em colunas quando falta altura */
.notes.strings {
  --g: 0.5rem;
  display: grid;
  width: 100%;
  height: min(100cqh, 28rem);
  grid-template-columns: 1fr;
  grid-template-rows: repeat(8, minmax(0, 1fr));
  gap: var(--g);
}
@container (max-height: 339px) {
  .notes.strings {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(4, minmax(0, 1fr));
  }
}
@container (max-height: 339px) and (min-aspect-ratio: 3/1) {
  .notes.strings {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
  }
}
.notes.strings .note { min-height: 0; font-size: 1.1rem; }

.note {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  border-radius: 9999px;
  color: var(--foreground);
  font-weight: 700;
}
.note .line {
  height: 0.25rem;
  min-width: 0.25rem;
  flex: 1;
  border-radius: 0.25rem;
  background: color-mix(in oklch, var(--card) 80%, transparent);
}

/* Acende ao tocar */
.pad.lit,
.note.lit {
  animation: pop 250ms ease-out;
  box-shadow: var(--shadow-glow);
}
.key.lit,
.black.lit { animation: none; }

/* Música de fundo: 3 botões lado a lado (celular) */
.styles {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.5rem;
}
.style-btn {
  display: flex;
  min-width: 0;
  flex-direction: column;
  align-items: center;
  padding: 0.4rem 0.25rem;
  border-radius: 1.25rem;
  background: var(--accent);
  color: var(--accent-foreground);
  font-size: 0.95rem;
  line-height: 1.2;
  font-weight: 700;
}
.style-btn[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); }
.style-btn .icon { display: inline-block; font-size: 1.4rem; line-height: 1.3; }
.style-btn .icon.beat { animation: pop 250ms ease-out; }

/* Faíscas */
#sparks { pointer-events: none; }
.spark {
  position: fixed;
  z-index: 50;
  font-size: 2rem;
  line-height: 1.2;
  pointer-events: none;
  animation: float-up 1.1s ease-out forwards;
}

/* ---------- celular deitado (pouca altura): tudo numa tela só ---------- */
@media (max-height: 520px) {
  header {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .app { gap: 0.5rem; }
  .current { display: none; }
  .inst { padding: 0.2rem 0.1rem; }
  .inst .emoji { font-size: 1.5rem; line-height: 1.2; }
  .inst .label { display: block; }
  .panel { padding: 0.5rem; }
  .panel-music {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
  }
  .panel-title { margin: 0; }
  .styles { display: flex; gap: 0.6rem; }
  .style-btn { flex-direction: row; gap: 0.4rem; padding: 0.3rem 1rem; font-size: 1.05rem; }
  .style-btn .icon { font-size: 1.2rem; }
  .hint { margin-top: 0.25rem; }
}

/* ---------- tablet e computador: mais espaço, rótulos e sombras maiores ---------- */
@media (min-width: 640px) and (min-height: 521px) {
  .instruments { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; }
  .inst { width: 6rem; padding: 0.5rem; border-radius: 2.25rem; }
  .inst[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--card), var(--shadow-glow); }
  .inst .emoji { font-size: 2.25rem; line-height: 1.1; }
  .inst .label { display: block; font-size: 0.875rem; }
  .panel { padding: 1rem; border-width: 4px; border-radius: 2rem; box-shadow: 0 6px 0 oklch(0.45 0.15 310 / 0.35); }
  .panel-title { margin-bottom: 0.75rem; font-size: 1.25rem; }
  .current { margin-bottom: 0.75rem; font-size: 1.5rem; }
  .hint { margin-top: 0.75rem; font-size: 0.875rem; }
  .styles { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
  .style-btn { flex-direction: row; gap: 0.5rem; padding: 0.75rem 1.5rem; font-size: 1.5rem; }
  .style-btn .icon { font-size: 1.5rem; }
  .spark { font-size: 2.25rem; }
}

/* ---------- animações ---------- */
@keyframes float-up {
  0% { transform: translate(-50%, 0) scale(0.6) rotate(-10deg); opacity: 1; }
  100% { transform: translate(-50%, -160px) scale(1.4) rotate(15deg); opacity: 0; }
}
@keyframes pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.12); }
  100% { transform: scale(1); }
}
@keyframes pulse {
  50% { opacity: 0.5; }
}
@keyframes fade {
  0% { opacity: 1; }
  100% { opacity: 0; }
}


/* ---------- modo Musiquinhas ---------- */
.topbar { display: flex; flex-direction: column; gap: 0.5rem; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.mode-btn {
  padding: 0.4rem 0.5rem;
  border: 3px solid var(--card);
  border-radius: 9999px;
  background: color-mix(in oklch, var(--card) 70%, transparent);
  color: var(--foreground);
  font-size: 1.05rem;
  line-height: 1.3;
  font-weight: 700;
}
.mode-btn[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); }
.songs { min-width: 0; }
.song-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; padding: 0.2rem 0.3rem 0.5rem; }
.song-btn {
  position: relative;
  display: flex;
  min-width: 0;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0.3rem 0.25rem;
  border-radius: 1.25rem;
  background: var(--accent);
  color: var(--accent-foreground);
  font-size: 0.85rem;
  line-height: 1.15;
  font-weight: 700;
}
.song-btn .emoji { font-size: 2rem; line-height: 1.2; }
.song-btn .star { position: absolute; top: -0.45rem; right: -0.2rem; font-size: 1.1rem; line-height: 1; }
.song-btn[aria-pressed="true"] { background: var(--secondary); color: var(--primary-foreground); }
.listen-btn {
  display: flex;
  min-height: 4rem;
  align-items: center;
  justify-content: center;
  border-radius: 1.25rem;
  background: var(--mint);
  color: var(--foreground);
  font-size: 2.4rem;
  line-height: 1;
}
.listen-btn[aria-pressed="true"] { background: var(--destructive); color: var(--primary-foreground); }
.progress { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.3rem; margin: 0 0 0.5rem; }
.progress i {
  display: inline-flex;
  width: 1.2rem;
  height: 1.2rem;
  align-items: center;
  justify-content: center;
  border-radius: 9999px;
  font-size: 0.95rem;
  font-style: normal;
  line-height: 1;
  opacity: 0.3;
  transition: transform 120ms, opacity 120ms;
}
.progress i.done { opacity: 1; }
.progress i.cur { opacity: 1; background: transparent; transform: scale(1.4); }
.inst:disabled { opacity: 0.3; filter: grayscale(0.7); cursor: default; }

/* tecla que deve ser tocada agora */
@keyframes guide-pulse {
  0%, 100% { transform: scale(1); filter: brightness(1); }
  50% { transform: scale(1.07); filter: brightness(1.12); }
}
@keyframes guide-help {
  0%, 100% { transform: scale(1) translateY(0); }
  50% { transform: scale(1.16) translateY(-5px); }
}
@keyframes nudge {
  0%, 100% { translate: 0 0; }
  25% { translate: -6px 0; }
  75% { translate: 6px 0; }
}
.guide {
  z-index: 2;
  animation: guide-pulse 0.8s ease-in-out infinite;
  box-shadow: 0 0 0 4px var(--card), 0 0 0 8px var(--primary), 0 0 28px 8px oklch(0.86 0.17 90 / 0.9);
}
.guide.help { animation: guide-help 0.55s ease-in-out infinite; }
.key.guide { z-index: 0; background: var(--accent); }
.black.guide { background: var(--primary); }

  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;

  background: oklch(0.3 0.12 310 / 0.55);

.conf { position: absolute; top: -3rem; line-height: 1; animation: conf-fall linear infinite; }
@keyframes conf-fall { to { transform: translateY(115vh) rotate(360deg); } }
@keyframes party-pop { 0% { transform: scale(0.4); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
.party-card {
  position: relative;
  max-width: 24rem;
  padding: 1.25rem 1.5rem;
  border: 5px solid var(--card);

.party-emoji { font-size: 4rem; line-height: 1.1; }

.party-sub { margin: 0 0 0.5rem; font-size: 1.1rem; font-weight: 700; }
.stickers { margin: 0 0 0.75rem; font-size: 1.6rem; line-height: 1.3; letter-spacing: 0.2rem; }

.party-actions #again { background: var(--accent); }
.party-actions #next { background: var(--primary); }

@media (max-height: 520px) {
  .topbar { flex-direction: row; align-items: center; gap: 0.5rem; }
  .modes { flex: 0 0 auto; grid-template-columns: auto auto; }
  .mode-btn { padding: 0.15rem 0.8rem; font-size: 0.95rem; }
  .songs { flex: 1; }
  .song-list { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.4rem; padding: 0.3rem 0.3rem 0.4rem; }
  .song-btn { padding: 0.1rem 0.2rem; font-size: 0.65rem; }
  .song-btn .emoji { font-size: 1.2rem; line-height: 1.1; }
  .listen-btn { min-height: 0; font-size: 1.5rem; }
  .progress { margin-bottom: 0.25rem; gap: 0.2rem; }
  .progress i { width: 0.9rem; height: 0.9rem; font-size: 0.7rem; }
  .party-emoji { font-size: 2.5rem; }
  .party-title { font-size: 1.5rem; }
  .party-sub { margin-bottom: 0.25rem; font-size: 0.95rem; }
  .stickers { margin-bottom: 0.4rem; font-size: 1.2rem; }
  .party-actions .toy { padding: 0.2rem 1.2rem; font-size: 1.6rem; }
}
@media (min-width: 640px) and (min-height: 521px) {
  .modes { grid-template-columns: repeat(2, minmax(0, 14rem)); justify-content: center; }
  .mode-btn { padding: 0.5rem 1rem; font-size: 1.4rem; }
  .song-list { grid-template-columns: repeat(6, 7rem); justify-content: center; }
  .song-btn { font-size: 1rem; }
  .song-btn .emoji { font-size: 2.4rem; }
  .listen-btn { font-size: 3rem; }
  .progress i { width: 1.5rem; height: 1.5rem; font-size: 1.2rem; }
}

@media (prefers-reduced-motion: reduce) {
  .guide, .guide.help, .gear.holding { animation: none; }
  .conf { display: none; }
  .party-card { animation: none; }
  .start-btn { animation: none; }
  .spark { animation: fade 1.1s ease-out forwards; }
  .pad.lit, .note.lit, .style-btn .icon.beat { animation: none; }
  .toy { transition: none; }
}

    <script>
/* O Estúdio Musical da Helena Sophia
 * Todos os sons são gerados pelo navegador (Web Audio API). Não há arquivos de áudio. */
(() => {
  "use strict";

  /* =====================================================================
   * 1. MOTOR DE ÁUDIO
   * ===================================================================== */
  let ctx = null;
  let master = null; // volume geral
  let backingMaster = null; // volume da música de fundo
  let curBus = null; // canal da música de fundo que está tocando agora
  let noiseBuf = null;
  let distCurve = null;

  function getCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC({ latencyHint: "interactive" });
      // No iPhone/iPad recente, faz o som tocar mesmo com o botão de silêncio ligado.
      try {
        if (navigator.audioSession) navigator.audioSession.type = "playback";
      } catch (e) {
        /* sem suporte: ignora */
      }
      const comp = ctx.createDynamicsCompressor();
      comp.connect(ctx.destination);
      master = ctx.createGain();
      master.gain.value = settings.volume / 100;
      master.connect(comp);
      backingMaster = ctx.createGain();
      backingMaster.gain.value = 0.45;
      backingMaster.connect(master);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  const midiToFreq = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function env(g, t, a, peak, d, sustain = 0.0001) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(Math.max(sustain, 0.0001), t + a + d);
  }

  function distortion() {
    if (!distCurve) {
      distCurve = new Float32Array(1024);
      for (let i = 0; i < 1024; i++) {
        const x = (i / 1023) * 2 - 1;
        distCurve[i] = Math.tanh(x * 6);
      }
    }
    const s = getCtx().createWaveShaper();
    s.curve = distCurve;
    return s;
  }

  // Um único buffer de ruído (1,5 s) reaproveitado por todos os sons.
  function noiseBuffer() {
    const c = getCtx();
    if (!noiseBuf || noiseBuf.sampleRate !== c.sampleRate) {
      noiseBuf = c.createBuffer(1, Math.floor(c.sampleRate * 1.5), c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }

  function playNote(inst, midi, when, out, vel = 1) {
    const c = getCtx();
    const t = when != null ? when : c.currentTime;
    const dest = out || master;
    const f = midiToFreq(midi);
    const g = c.createGain();
    g.connect(dest);

    const osc = (type, freq, to = g) => {
      const o = c.createOscillator();
      o.type = type;
      o.frequency.value = freq;
      o.connect(to);
      return o;
    };
    const vibrato = (o, rate, depth, delay, end) => {
      const l = c.createOscillator();
      const lg = c.createGain();
      l.frequency.value = rate;
      lg.gain.setValueAtTime(0, t);
      lg.gain.linearRampToValueAtTime(depth, t + delay);
      l.connect(lg).connect(o.frequency);
      l.start(t);
      l.stop(end);
    };

    switch (inst) {
      case "piano": {
        env(g, t, 0.005, 0.5 * vel, 1.6);
        const o1 = osc("triangle", f);
        const o2 = osc("sine", f * 2);
        [o1, o2].forEach((o) => {
          o.start(t);
          o.stop(t + 1.8);
        });
        break;
      }
      case "violao": {
        const lp = c.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.setValueAtTime(3500, t);
        lp.frequency.exponentialRampToValueAtTime(400, t + 1);
        lp.connect(g);
        env(g, t, 0.003, 0.45 * vel, 1.4);
        const o = osc("sawtooth", f, lp);
        const o2 = osc("triangle", f * 0.5, lp);
        [o, o2].forEach((x) => {
          x.start(t);
          x.stop(t + 1.5);
        });
        break;
      }
      case "guitarra": {
        const lp = c.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 2600;
        const d = distortion();
        const pre = c.createGain();
        pre.gain.value = 0.6;
        pre.connect(d).connect(lp).connect(g);
        env(g, t, 0.005, 0.22 * vel, 1.2, 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
        const o = osc("sawtooth", f, pre);
        const o2 = osc("sawtooth", f * 1.5, pre);
        [o, o2].forEach((x) => {
          x.start(t);
          x.stop(t + 1.7);
        });
        break;
      }
      case "flautaDoce":
      case "flautaTransversal": {
        const tr = inst === "flautaTransversal";
        const ff = tr ? f : f * 2;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.35 * vel, t + 0.06);
        g.gain.setValueAtTime(0.35 * vel, t + 0.5);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
        const o = osc(tr ? "sine" : "triangle", ff);
        if (tr) vibrato(o, 5, 6, 0.2, t + 1);
        o.start(t);
        o.stop(t + 1);
        // sopro
        const n = c.createBufferSource();
        n.buffer = noiseBuffer();
        const bp = c.createBiquadFilter();
        bp.type = "bandpass";
        bp.frequency.value = ff * 2;
        bp.Q.value = 2;
        const ng = c.createGain();
        ng.gain.value = tr ? 0.12 : 0.05;
        n.connect(bp).connect(ng).connect(g);
        n.start(t);
        n.stop(t + 1);
        break;
      }
      case "violino": {
        const lp = c.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 3000;
        lp.Q.value = 3;
        lp.connect(g);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.25 * vel, t + 0.15);
        g.gain.setValueAtTime(0.25 * vel, t + 0.7);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
        const o = osc("sawtooth", f * 2, lp);
        vibrato(o, 5.5, 8, 0.25, t + 1.4);
        o.start(t);
        o.stop(t + 1.4);
        break;
      }
      default:
        break;
    }
  }

  function playDrum(id, when, out, vel = 1) {
    const c = getCtx();
    const t = when != null ? when : c.currentTime;
    const g = c.createGain();
    g.connect(out || master);

    const noise = (dur, type, freq, peak) => {
      const n = c.createBufferSource();
      n.buffer = noiseBuffer();
      const fl = c.createBiquadFilter();
      fl.type = type;
      fl.frequency.value = freq;
      const ng = c.createGain();
      env(ng, t, 0.002, peak * vel, dur);
      n.connect(fl).connect(ng).connect(g);
      n.start(t);
      n.stop(t + dur + 0.05);
    };
    const tone = (from, to, dur, peak) => {
      const o = c.createOscillator();
      o.frequency.setValueAtTime(from, t);
      o.frequency.exponentialRampToValueAtTime(to, t + dur);
      const og = c.createGain();
      env(og, t, 0.002, peak * vel, dur);
      o.connect(og).connect(g);
      o.start(t);
      o.stop(t + dur + 0.05);
    };

    switch (id) {
      case "bumbo":
        tone(150, 45, 0.4, 1);
        break;
      case "caixa":
        tone(220, 120, 0.12, 0.4);
        noise(0.2, "highpass", 1500, 0.5);
        break;
      case "chimbal":
        noise(0.06, "highpass", 7000, 0.3);
        break;
      case "tom":
        tone(180, 90, 0.35, 0.7);
        break;
      case "prato":
        noise(1.2, "highpass", 5000, 0.35);
        break;
      case "palma":
        [0, 0.012, 0.024].forEach((d) => {
          const n = c.createBufferSource();
          n.buffer = noiseBuffer();
          const fl = c.createBiquadFilter();
          fl.type = "bandpass";
          fl.frequency.value = 1200;
          const ng = c.createGain();
          ng.gain.setValueAtTime(0.0001, t + d);
          ng.gain.exponentialRampToValueAtTime(0.5 * vel, t + d + 0.002);
          ng.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.12);
          n.connect(fl).connect(ng).connect(g);
          n.start(t + d);
          n.stop(t + d + 0.15);
        });
        break;
      default:
        break;
    }
  }

  /* ---------- Músicas de fundo (todas em Dó maior: qualquer nota combina) ---------- */
  const C = [48, 52, 55];
  const Am = [45, 48, 52];
  const F = [41, 45, 48];
  const G = [43, 47, 50];

  const pad = (chord, t, dur) => {
    const c = getCtx();
    chord.forEach((m) => {
      const o = c.createOscillator();
      o.type = "sine";
      o.frequency.value = midiToFreq(m + 12);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + dur * 0.3);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(curBus);
      o.start(t);
      o.stop(t + dur);
    });
  };
  const bass = (m, t, dur, type = "triangle", peak = 0.4) => {
    const c = getCtx();
    const o = c.createOscillator();
    o.type = type;
    o.frequency.value = midiToFreq(m - 12);
    const lp = c.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 600;
    const g = c.createGain();
    env(g, t, 0.01, peak, dur);
    o.connect(lp).connect(g).connect(curBus);
    o.start(t);
    o.stop(t + dur + 0.05);
  };

  const TRACKS = {
    calmo: {
      bpm: 72,
      chords: [C, Am, F, G],
      step: (s, t, ch, sd) => {
        if (s % 16 === 0) pad(ch, t, sd * 16);
        if (s % 4 === 0) bass(ch[0], t, sd * 3, "sine", 0.3);
        if (s % 2 === 0) playNote("piano", (ch[(s / 2) % 3] || ch[0]) + 24, t, curBus, 0.35);
      },
    },
    rock: {
      bpm: 120,
      chords: [C, G, Am, F],
      step: (s, t, ch, sd) => {
        const b = s % 16;
        if (b === 0 || b === 6 || b === 8 || b === 10) playDrum("bumbo", t, curBus);
        if (b === 4 || b === 12) playDrum("caixa", t, curBus);
        if (s % 2 === 0) playDrum("chimbal", t, curBus, 0.7);
        if (s % 2 === 0) bass(ch[0], t, sd * 1.8, "sawtooth", 0.3);
        if (s === 0) playDrum("prato", t, curBus, 0.6);
        if (b === 0 || b === 8)
          [ch[0] + 12, ch[0] + 19].forEach((m) => playNote("guitarra", m, t, curBus, 0.6));
      },
    },
    baile: {
      bpm: 124,
      chords: [Am, F, C, G],
      step: (s, t, ch, sd) => {
        const b = s % 16;
        if (b % 4 === 0) playDrum("bumbo", t, curBus);
        if (b % 4 === 2) {
          playDrum("chimbal", t, curBus, 1);
          bass(ch[0] + 12, t, sd, "square", 0.18);
        }
        if (b === 4 || b === 12) playDrum("palma", t, curBus, 0.8);
        if (b % 4 === 0) bass(ch[0], t, sd, "square", 0.2);
        if (b === 2 || b === 7 || b === 10) ch.forEach((m) => playNote("piano", m + 12, t, curBus, 0.3));
      },
    },
  };

  // Relógio que não "dorme" quando a aba fica em segundo plano (usa um Worker).
  function makeTimer(fn, ms) {
    try {
      const src = "let id=setInterval(()=>postMessage(0)," + ms + ");onmessage=()=>clearInterval(id);";
      const url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
      const w = new Worker(url);
      w.onmessage = fn;
      return {
        stop() {
          w.postMessage("stop");
          w.terminate();
          URL.revokeObjectURL(url);
        },
      };
    } catch (e) {
      const id = setInterval(fn, ms);
      return { stop: () => clearInterval(id) };
    }
  }

  let session = null;

  function startBacking(style, onBeat) {
    stopBacking();
    const c = getCtx();
    const tr = TRACKS[style];
    const sd = 60 / tr.bpm / 4; // semicolcheia
    const bus = c.createGain();
    bus.connect(backingMaster);
    curBus = bus;
    let step = 0;
    let next = c.currentTime + 0.1;
    const me = {};
    const tick = () => {
      while (next < c.currentTime + 0.25) {
        const chord = tr.chords[Math.floor(step / 16) % tr.chords.length] || C;
        tr.step(step % 64, next, chord, sd);
        if (step % 4 === 0 && onBeat) {
          const delay = Math.max(0, (next - c.currentTime) * 1000);
          const beat = step / 4;
          setTimeout(() => {
            if (session === me) onBeat(beat);
          }, delay);
        }
        step++;
        next += sd;
      }
    };
    me.bus = bus;
    me.timer = makeTimer(tick, 25);
    session = me;
  }

  // Para a música com um fade rápido (sem deixar o som "arrastar").
  function stopBacking() {
    if (!session) return;
    const { bus, timer } = session;
    session = null;
    timer.stop();
    const c = getCtx();
    bus.gain.cancelScheduledValues(c.currentTime);
    bus.gain.setValueAtTime(bus.gain.value, c.currentTime);
    bus.gain.linearRampToValueAtTime(0, c.currentTime + 0.12);
    setTimeout(() => bus.disconnect(), 500);
  }

  function make(tag, className, attrs) {

    return e;

  function spark(x, y) {
    const e = make("span", "spark");
    e.textContent = SPARKS[++sparkId % SPARKS.length];
    e.style.left = x + "px";
    e.style.top = y + "px";
    while (sparksEl.children.length >= 20) sparksEl.firstChild.remove();

    setTimeout(() => e.remove(), 1100);

  function hit(elem) {
    let x = window.innerWidth / 2;
    let y = window.innerHeight / 2;
    if (elem) {
      elem.classList.remove("lit");
      void elem.offsetWidth; // reinicia a animação se tocar de novo rápido
      elem.classList.add("lit");
      clearTimeout(elem._litTimer);
      elem._litTimer = setTimeout(() => elem.classList.remove("lit"), 180);
      const r = elem.getBoundingClientRect();
      x = r.left + r.width / 2;
      y = r.top;
    }
    spark(x, y);
  }

      grid.append(b);
    });

    if (strings) {
      // Arrastar o dedo (ou o mouse) pelas cordas toca cada uma que for cruzada.
      // Usa a posição do ponteiro, por isso também funciona em telas de toque.
      let last = null;
      grid.addEventListener("pointerdown", (e) => {
        last = e.target.closest("[data-midi]");
      });
      grid.addEventListener("pointermove", (e) => {
        if (!e.buttons) return;
        const under = document.elementFromPoint(e.clientX, e.clientY);
        const target = under && under.closest("[data-midi]");
        if (target && grid.contains(target) && target !== last) {
          last = target;
          playMidi(Number(target.dataset.midi), target);
        }
      });
      const end = () => {
        last = null;
      };
      grid.addEventListener("pointerup", end);
      grid.addEventListener("pointercancel", end);
      grid.addEventListener("pointerleave", end);
    }

    boardEl.append(grid);
    setHint(strings, "Teclado: A S D F G H J K");
  }

   * Cada nota: número da nota (0 = Dó ... 7 = Dó agudo) e, depois de ":", quantos tempos dura.
   * ===================================================================== */
  const SONGS = [
    { id: "escada", emoji: "🪜", name: "Escadinha", bpm: 110, parts: "0 1 2 3 4 5 6 7:2" },
    {
      id: "estrela", emoji: "⭐", name: "Estrelinha", bpm: 96,
      parts: "0 0 4 4 5 5 4:2 3 3 2 2 1 1 0:2 | 4 4 3 3 2 2 1:2 4 4 3 3 2 2 1:2 | 0 0 4 4 5 5 4:2 3 3 2 2 1 1 0:2",
    },
    {
      id: "carneiro", emoji: "🐑", name: "Carneirinho", bpm: 104,
      parts: "2 1 0 1 2 2 2:2 1 1 1:2 2 4 4:2 | 2 1 0 1 2 2 2 2 1 1 2 1 0:2",

      id: "frei", emoji: "🔔", name: "Frei Jacó", bpm: 104,
      parts: "0 1 2 0 0 1 2 0 2 3 4:2 2 3 4:2 | 4:.5 5:.5 4:.5 3:.5 2 0 4:.5 5:.5 4:.5 3:.5 2 0 | 7 4 7:2 7 4 7:2",
    },
    {
      id: "alegria", emoji: "😄", name: "Alegria", bpm: 112,
      parts: "2 2 3 4 4 3 2 1 0 0 1 2 2:1.5 1:.5 1:2 | 2 2 3 4 4 3 2 1 0 0 1 2 1:1.5 0:.5 0:2",
    },
  ];
  SONGS.forEach((sg) => {
    sg.parts = sg.parts.split("|").map((part) =>

        const idx = Number(p[0]);
        return { idx, midi: NOTES[idx].midi, beats: p[1] ? parseFloat(p[1]) : 1 };
      })
    );
  });

    if (mode.listening) return;
    if (strong) e.classList.add("help");
    else mode.helpTimer = setTimeout(() => e.classList.add("help"), 5000);
  }

  function refreshGuide(strong) {
    const seq = curSeq();
    const ok = mode.on && !mode.listening && !mode.party && mode.pos < seq.length;
    applyGuide(ok ? seq[mode.pos].midi : null, strong);
  }

  function renderProgress() {
    const sg = curSong();
    const seq = curSeq();
    const sig = sg.id + ":" + mode.part;
    if (progressEl.dataset.sig !== sig) {
      progressEl.dataset.sig = sig;
      progressEl.replaceChildren();
      seq.forEach(() => progressEl.append(make("i")));
    }
    Array.prototype.forEach.call(progressEl.children, (el, i) => {
      el.className = NOTES[seq[i].idx].color + (i < mode.pos ? " done" : "") + (i === mode.pos ? " cur" : "");
      el.textContent = i === mode.pos ? "🐥" : "";
    });
  }

  // Chamado depois de desenhar o instrumento: textos, bolinhas e a tecla que brilha.
  function decorate() {
    progressEl.hidden = !mode.on;
    if (!mode.on) return;
    const sg = curSong();
    const inst = INSTRUMENTS.find((i) => i.id === state.inst) || INSTRUMENTS[0];
    let stars = "";
    if (sg.parts.length > 1) {
      stars = "  ";
      for (let i = 0; i < sg.parts.length; i++) stars += i < mode.part ? "⭐" : "☆";
    }
    currentEl.textContent = sg.emoji + " " + sg.name + " · " + inst.emoji + stars;
    hintEl.textContent = "👆 Toque na tecla que está brilhando!";
    renderProgress();
    refreshGuide();
  }

  function renderSongs() {
    songListEl.replaceChildren(listenBtn); // o botão de ouvir é sempre o primeiro
    SONGS.forEach((sg) => {
      const b = make("button", "toy song-btn", { type: "button", "aria-pressed": String(sg.id === mode.id) });
      b.innerHTML =
        '<span class="emoji">' + sg.emoji + "</span>" + sg.name + (mode.done[sg.id] ? '<span class="star">⭐</span>' : "");
      b.addEventListener("click", () => pickSong(sg.id));
      songListEl.append(b);
    });
    listenBtn.hidden = false;
  }

  function pickSong(id) {
    stopListen();
    closeParty();
    mode.id = id;
    mode.part = 0;
    mode.pos = 0;
    mode.wrong = 0;
    renderSongs();
    decorate();
    say("Vamos tocar " + curSong().name + "!");
  }

  function setMode(on) {
    if (mode.on === on) return;
    stopListen();
    closeParty();
    hush();
    mode.on = on;
    mode.part = 0;
    mode.pos = 0;
    mode.wrong = 0;
    modeFreeBtn.setAttribute("aria-pressed", String(!on));
    modeSongsBtn.setAttribute("aria-pressed", String(on));
    songsEl.hidden = !on;
    if (on && state.inst === "bateria") state.inst = "piano";
    if (on) renderSongs();
    renderInstruments();
    renderBoard();
    if (on) say("Vamos tocar!");
  }

  // Chamado a cada nota tocada (veja playMidi).
  function songPress(midi) {
    if (!mode.on || mode.listening || mode.party) return;
    const seq = curSeq();
    const want = seq[mode.pos];
    if (!want) return;
    if (midi === want.midi) {
      mode.pos++;
      mode.wrong = 0;
      renderProgress();
      if (mode.pos >= seq.length) {
        mode.party = true; // não aceita mais notas até a comemoração
        applyGuide(null);
        if (mode.part < curSong().parts.length - 1) {
          mode.partTimer = setTimeout(partDone, 500);
        } else {
          const sg = curSong();
          mode.celebTimer = setTimeout(() => celebrate(sg), 600);
        }
      } else {
        refreshGuide();
      }
    } else {
      // tecla errada: o som toca normalmente, e a tecla certa balança de leve
      const e = keyEl(want.midi);
      if (e) {
        e.classList.remove("nudge");
        void e.offsetWidth;
        e.classList.add("nudge");
        setTimeout(() => e.classList.remove("nudge"), 400);
        if (++mode.wrong >= 3) e.classList.add("help");
      }
    }
  }

  // Terminou um pedacinho: festinha rápida e já segue para o próximo.
  function partDone() {
    if (!mode.on || !mode.party) return;
    const c = getCtx();
    const t = c.currentTime + 0.05;
    [72, 76, 79].forEach((m, i) => playNote("piano", m, t + i * 0.1, null, 0.9));
    playDrum("palma", t + 0.3);
    for (let i = 0; i < 6; i++)
      spark(window.innerWidth * (0.15 + Math.random() * 0.7), window.innerHeight * (0.3 + Math.random() * 0.3));
    say("Muito bem!");
    mode.partTimer = setTimeout(() => {
      if (!mode.on || !mode.party) return;
      mode.party = false;
      mode.part++;
      mode.pos = 0;
      mode.wrong = 0;
      decorate();
    }, 1600);
  }

  /* ---------- Ouvir: o pedacinho toca sozinho e as teclas acendem ---------- */
  function updateListenBtn() {
    listenBtn.setAttribute("aria-pressed", String(mode.listening));
    listenBtn.setAttribute("aria-label", mode.listening ? "Parar" : "Ouvir");
    listenBtn.textContent = mode.listening ? "⏹" : "👂";
  }

  function startListen() {
    if (!mode.on || mode.listening || mode.party) return;
    hush();
    const sg = curSong();
    const seq = curSeq();
    const beatMs = 60000 / (sg.bpm * settings.speed);
    mode.listening = true;
    mode.pos = 0;
    updateListenBtn();
    applyGuide(null);
    renderProgress();
    getCtx();
    let i = 0;
    const step = () => {
      if (!mode.listening) return;
      if (i >= seq.length) {
        stopListen(true);
        return;
      }
      const n = seq[i];
      const e = keyEl(n.midi);
      playNote(state.inst, n.midi);
      hit(e);
      applyGuide(n.midi);
      clearTimeout(mode.offTimer);
      mode.offTimer = setTimeout(() => applyGuide(null), Math.min(n.beats * beatMs * 0.7, 600));
      i++;
      mode.pos = i;
      renderProgress();
      mode.timer = setTimeout(step, n.beats * beatMs);
    };
    step();
  }

  // natural = a música acabou sozinha: convida a Helena a tocar.
  function stopListen(natural) {
    clearTimeout(mode.timer);
    clearTimeout(mode.offTimer);
    if (!mode.listening) return;
    mode.listening = false;
    mode.pos = 0;
    updateListenBtn();
    if (mode.on) {
      renderProgress();
      refreshGuide(natural === true);
      if (natural === true) say("Agora é sua vez!");
    }
  }

  /* ---------- Comemoração final ---------- */
  const CONFETTI = ["🎉", "⭐", "💖", "🎵", "🌸", "✨", "🎶", "🎈"];

  function fanfare() {
    const c = getCtx();
    const t = c.currentTime + 0.05;
    [60, 64, 67, 72, 76, 79].forEach((m, i) => playNote("piano", m, t + i * 0.09, null, 0.9));
    [72, 76, 79, 84].forEach((m) => playNote("piano", m, t + 0.7, null, 1));
    playDrum("prato", t + 0.7, null, 0.9);
    [0.8, 1.0, 1.2].forEach((d) => playDrum("palma", t + d));
  }

  function celebrate(sg) {
    if (!mode.on || !mode.party || curSong() !== sg) return;
    mode.done[sg.id] = true;
    saveDone();
    renderSongs();
    partySub.textContent = "Você tocou “" + sg.name + "”!";
    stickersEl.textContent = SONGS.filter((x) => mode.done[x.id]).map((x) => x.emoji).join(" ");
    confettiEl.replaceChildren();
    for (let i = 0; i < 40; i++) {
      const e = make("span", "conf");
      e.textContent = CONFETTI[i % CONFETTI.length];
      e.style.left = Math.random() * 100 + "%";
      e.style.fontSize = 1.2 + Math.random() * 1.4 + "rem";
      e.style.animationDelay = (Math.random() * 1.6).toFixed(2) + "s";
      e.style.animationDuration = (2.4 + Math.random() * 2).toFixed(2) + "s";
      confettiEl.append(e);
    }
    partyEl.hidden = false;
    fanfare();
    setTimeout(() => say("Parabéns, Helena! Você tocou " + sg.name + "!"), 1500);
    $("again").focus({ preventScroll: true });
  }

  function closeParty() {
    clearTimeout(mode.partTimer);
    clearTimeout(mode.celebTimer);
    partyEl.hidden = true;
    confettiEl.replaceChildren();
    mode.party = false;
  }

  modeFreeBtn.addEventListener("click", () => setMode(false));
  modeSongsBtn.addEventListener("click", () => setMode(true));
  listenBtn.addEventListener("click", () => (mode.listening ? stopListen() : startListen()));
  $("again").addEventListener("click", () => {
    hush();
    closeParty();
    mode.part = 0;
    mode.pos = 0;
    mode.wrong = 0;
    decorate();
  });
  $("next").addEventListener("click", () => {
    const i = SONGS.findIndex((x) => x.id === mode.id);
    pickSong(SONGS[(i + 1) % SONGS.length].id);
  });
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && mode.party && !partyEl.hidden) $("again").click();
  });
  window.addEventListener("pagehide", () => {
    stopListen();
    hush();
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      stopListen();
      hush();
    }
  });

  /* =====================================================================
   * 5. CONTROLE DOS PAIS E GRAVAÇÃO DE MÚSICAS
   * A engrenagem só abre depois de segurar por 3 segundos.
   * ===================================================================== */
  const gear = $("gear");
  const parentEl = $("parent");
  const saveEl = $("savesong");
  const recBar = $("rec-bar");
  const recText = $("rec-text");
  const rec = { on: false, notes: [], pending: null, emoji: "🌈" };
  const EMOJIS = ["🌈", "🦄", "🐶", "🐱", "🌟", "🎈", "🍓", "🚀"];

  function applyVolume() {
    if (master) master.gain.value = settings.volume / 100;
  }

  function renderParent() {
    const v = $("opt-voice");
    v.setAttribute("aria-pressed", String(settings.voice));
    v.textContent = settings.voice ? "Ligada" : "Desligada";
    $("opt-vol").value = String(settings.volume);
    $("opt-speed").querySelectorAll("button").forEach((b) => {
      b.classList.toggle("on", Number(b.dataset.v) === settings.speed);
    });
    const mine = $("mine");
    mine.replaceChildren();
    SONGS.filter((x) => x.custom).forEach((sg) => {
      const row = make("div", "mine-row");
      const label = make("span");
      label.textContent = sg.emoji + " " + sg.name;
      const del = make("button", "toy chip", { type: "button", "aria-label": "Apagar " + sg.name });
      del.textContent = "🗑";
      del.addEventListener("click", () => {
        if (!window.confirm("Apagar a música “" + sg.name + "”?")) return;
        SONGS.splice(SONGS.indexOf(sg), 1);
        saveCustom();
        delete mode.done[sg.id];
        saveDone();
        if (mode.id === sg.id) {
          stopListen();
          closeParty();
          mode.id = SONGS[0].id;
          mode.part = 0;
          mode.pos = 0;
        }
        if (mode.on) {
          renderSongs();
          decorate();
        }
        renderParent();
      });
      row.append(label, del);
      mine.append(row);
    });
  }

  const openParent = () => {
    stopListen();
    renderParent();
    parentEl.hidden = false;
  };
  const closeParentSheet = () => {
    parentEl.hidden = true;
  };

  // Segurar a engrenagem por 3 segundos (a engrenagem gira enquanto segura).
  let gearTimer = null;
  const gearCancel = () => {
    clearTimeout(gearTimer);
    gear.classList.remove("holding");
  };
  gear.addEventListener("pointerdown", () => {
    gearCancel();
    void gear.offsetWidth;
    gear.classList.add("holding");
    gearTimer = setTimeout(() => {
      gearCancel();
      openParent();
    }, 3000);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach((t) => gear.addEventListener(t, gearCancel));
  gear.addEventListener("contextmenu", (e) => e.preventDefault());
  gear.addEventListener("click", (e) => {
    if (e.detail === 0) openParent(); // quem usa o teclado (adulto) abre direto
  });

  $("parent-close").addEventListener("click", closeParentSheet);
  $("opt-voice").addEventListener("click", () => {
    settings.voice = !settings.voice;
    if (!settings.voice) hush();
    saveSettings();
    renderParent();
  });
  $("opt-vol").addEventListener("input", (e) => {
    settings.volume = Number(e.target.value);
    applyVolume();
    saveSettings();
  });
  $("opt-vol").addEventListener("change", () => {
    getCtx();
    playNote("piano", 72);
  });
  $("opt-speed").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    settings.speed = Number(b.dataset.v);
    saveSettings();
    renderParent();
  });

  /* ---------- Gravar ---------- */
  function recordNote(midi) {
    if (!rec.on) return;
    const idx = NOTES.findIndex((n) => n.midi === midi);
    if (idx < 0) return; // teclas pretas e bateria não entram
    rec.notes.push({ idx, t: performance.now() });
    recText.textContent = "🔴 Gravando · " + rec.notes.length + (rec.notes.length === 1 ? " nota" : " notas");
    if (rec.notes.length >= 60) finishRecording();
  }

  function startRecording() {
    closeParentSheet();
    stopListen();
    closeParty();
    setMode(false); // grava no modo livre, sem luzes atrapalhando
    rec.on = true;
    rec.notes = [];
    recText.textContent = "🔴 Gravando… toque a melodia";
    recBar.hidden = false;
    getCtx();
  }

  function cancelRecording() {
    rec.on = false;
    rec.notes = [];
    recBar.hidden = true;
  }

  function finishRecording() {
    if (rec.notes.length < 3) {
      recText.textContent = "🔴 Toque pelo menos 3 notas";
      return;
    }
    rec.on = false;
    recBar.hidden = true;
    rec.pending = rec.notes.slice(0, 60);
    rec.notes = [];
    rec.emoji = EMOJIS[0];
    const n = SONGS.filter((x) => x.custom).length + 1;
    $("song-name").value = "Minha música " + n;
    $("save-info").textContent = rec.pending.length + " notas gravadas. Dê um nome e escolha uma figurinha:";
    renderEmojiPick();
    saveEl.hidden = false;
  }

  function renderEmojiPick() {
    const box = $("emoji-pick");
    box.replaceChildren();
    EMOJIS.forEach((em) => {
      const b = make("button", "toy emoji-opt", { type: "button", "aria-pressed": String(em === rec.emoji), "aria-label": em });
      b.textContent = em;
      b.addEventListener("click", () => {
        rec.emoji = em;
        renderEmojiPick();
      });
      box.append(b);
    });
  }

  // Transforma o que foi tocado em música: descobre o andamento, os tempos e divide em pedacinhos.
  function buildSong(raw, name, emoji) {
    const gaps = [];
    for (let i = 0; i < raw.length - 1; i++) gaps.push(raw[i + 1].t - raw[i].t);
    const sorted = gaps.slice().sort((a, b) => a - b);
    const med = sorted[Math.floor(sorted.length / 2)] || 600;
    const unit = Math.min(Math.max(med, 350), 900);
    const notes = raw.map((n, i) => {
      const gap = i < gaps.length ? gaps[i] : unit * 2;
      const beats = Math.min(Math.max(Math.round((gap / unit) * 2) / 2, 0.5), 4);
      return [n.idx, beats];
    });
    const parts = [];
    let cur = [];
    notes.forEach((n, i) => {
      cur.push(n);
      const end = (cur.length >= 8 && n[1] >= 2) || cur.length >= 14;
      if (end && i < notes.length - 1) {
        parts.push(cur);
        cur = [];
      }
    });
    if (cur.length) {
      if (cur.length < 4 && parts.length) parts[parts.length - 1].push(...cur);
      else parts.push(cur);
    }
    return { id: "u" + Date.now(), emoji, name, bpm: Math.round(60000 / unit), parts };
  }

  $("rec-start").addEventListener("click", startRecording);
  $("rec-done").addEventListener("click", finishRecording);
  $("rec-cancel").addEventListener("click", cancelRecording);
  $("save-no").addEventListener("click", () => {
    rec.pending = null;
    saveEl.hidden = true;
  });
  $("save-ok").addEventListener("click", () => {
    if (!rec.pending) return;
    const name = $("song-name").value.trim() || "Minha música";
    const sg = hydrate(buildSong(rec.pending, name, rec.emoji));
    SONGS.push(sg);
    saveCustom();
    rec.pending = null;
    saveEl.hidden = true;
    setMode(true);
    mode.done[sg.id] = false;
    pickSong(sg.id);
  });
  window.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!parentEl.hidden) closeParentSheet();
    else if (!saveEl.hidden) $("save-no").click();
  });

  // Teclado do computador: A S D F G H J K (bateria: A S D F G H)
  window.addEventListener("keydown", (e) => {
    if (!state.started || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (state.inst === "bateria") {
      const d = DRUMS.find((x) => x.key === k);
      if (d) playPad(d.id, boardEl.querySelector('[data-k="d' + d.id + '"]'));
    } else {
      const n = NOTES.find((x) => x.key === k);
      if (n) playMidi(n.midi, boardEl.querySelector('[data-k="n' + n.midi + '"]'));
    }
  });

  window.addEventListener("pagehide", stopBacking);

  // No celular, ao sair do app ou bloquear a tela, a música para (em vez de ficar tocando escondida).
  const touchDevice = window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (touchDevice && state.style) {
        stopBacking();
        state.style = null;
        renderStyles();
      }
    } else if (ctx && ctx.state === "suspended") {
      ctx.resume();
    }
  });

  $("start").addEventListener("click", () => {
    getCtx(); // o navegador só libera o som depois de um clique
    state.started = true;
    intro.hidden = true;
    app.hidden = false;
    renderInstruments();
    renderBoard();
    renderStyles();
  });
})();

</script>
    <script>
/* Instalar como aplicativo (PWA) + funcionar sem internet */
(() => {
  const btn = document.getElementById("install");
  const hint = document.getElementById("install-hint");
  const standalone =
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;

  // O arquivo "sw.js" guarda o app no aparelho. Só funciona em https:// (ou localhost).
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
  if (standalone) return; // já está instalado: não mostra o botão

  let deferred = null;
  const ios =
    /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferred = e;
    btn.hidden = false;
  });
  window.addEventListener("appinstalled", () => {
    deferred = null;
    btn.hidden = true;
    hint.hidden = true;
  });
  if (ios) btn.hidden = false; // iPhone/iPad não têm botão automático: mostramos como fazer

  btn.addEventListener("click", async () => {
    if (deferred) {
      deferred.prompt();
      try {
        await deferred.userChoice;
      } catch (e) {
        /* ignora */
      }
      deferred = null;
      btn.hidden = true;
      return;
    }
    hint.textContent = ios
      ? "No iPhone/iPad: toque em Compartilhar (⬆️) e depois em “Adicionar à Tela de Início”."
      : "Use o menu do navegador e escolha “Instalar app” ou “Adicionar à tela inicial”.";
    hint.hidden = false;
  });
})();
    </script>
  </body>
